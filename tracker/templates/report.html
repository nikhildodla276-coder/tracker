<!DOCTYPE HTML>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Report</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<bpdy>
    <div class="container">
        <h1>Daily Report</h1>
        <table>
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Task</th>
                    <th>Rating</th>
                    <th>Notes</th>
                </tr>
            </thead>
            <tbody>
                {% for log in logs %}
                <tr>
                    <td>{{ log['date'] }}</td>
                    <td>{{ log['task_name'] }}</td>
                    <td>{{ log['rating'] }}</td>
                    <td>{{ log['notes'] }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</bpdy>
</html>
